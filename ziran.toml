# Shared practice figures, pose and skinning APIs, cloth, and the assets
# that place the figures in each practice stage (shared/figure/backdrops/).
[package]
name = "practices"
module_roots = ["figure", "tests"]
# Only for building this package's own tests; consumers declare their own.
links = ["EGL", "GLESv2", "GLX", "X11", "z", "m", "pthread"]

[toolchain]
git = "https://git.waozi.xyz/ziranlang/ziran.git"
ref = "5db3d3c39425d5dfe4bfe4a84e6f6e2e5a810ad0"

[dependencies.kryon]
git = "https://git.waozi.xyz/kryonlabs/kryon.git"
ref = "43e6ea3d76ded207e2be93ff82b2a609c3cfeb91"

[exports]
figure_math = "figure/figure_math.zi"
figure_cloth = "figure/figure_cloth.zi"
figure_joints = "figure/figure_joints.zi"
figure_skin = "figure/figure_skin.zi"
figure_finish = "figure/figure_finish.zi"
figure_model = "figure/figure_model.zi"
figure_stage = "figure/figure_stage.zi"
