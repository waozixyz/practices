# The shared practice figure: one anatomical character, its rig and its
# watercolor look, drawn by every practice from that practice's own poses.
# The media it reads stays in shared/watercolor/.
[package]
name = "practices"
module_roots = ["figure", "tests"]
# Only for building this package's own tests; consumers declare their own.
links = ["EGL", "GLESv2", "GLX", "X11", "z", "m", "pthread"]

[toolchain]
git = "https://github.com/ziranlang/ziran.git"
ref = "7fbc8152b0ab18b641a73d16d93ccda1e1c7f863"

[dependencies.kryon]
git = "https://github.com/kryonlabs/kryon.git"
ref = "8e44f3f86262924f513b28cc807e67b1138e5e0b"

[exports]
figure_math = "figure/figure_math.zi"
figure_anatomy = "figure/figure_anatomy.zi"
figure_joints = "figure/figure_joints.zi"
figure_skin = "figure/figure_skin.zi"
figure_shader = "figure/figure_shader.zi"
figure_wash = "figure/figure_wash.zi"
figure_paint = "figure/figure_paint.zi"
